<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CATALOGO PEPE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* Fondo general para toda la página */
    body {
      background-image: url('./Fondo.jpg'); /* Cambia a .png si tu imagen es PNG */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* 1. Barra superior en negro */
    .top-bar {
      background-color: #111111;
      color: white;
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      padding: 6px 40px;
      font-size: 12px;
    }

    .top-bar a {
      color: white;
      text-decoration: none;
    }

    /* 2. Navegación principal en negro */
    .main-nav {
      background-color: #111111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn-categories {
      background-color: transparent;
      border: 1px solid white;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box {
      display: flex;
      flex: 1;
      max-width: 450px;
      margin: 0 20px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 15px;
      border: none;
      border-radius: 20px 0 0 20px;
      outline: none;
    }

    .search-box button {
      background-color: #222222;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 0 20px 20px 0;
      cursor: pointer;
    }

    .nav-user {
      display: flex;
      gap: 15px;
      align-items: center;
      color: white;
      font-size: 13px;
    }

    .nav-user a {
      color: white;
      text-decoration: none;
    }

    /* Título principal */
    .content {
      text-align: center;
      padding-top: 40px;
      padding-bottom: 20px;
      color: white;
    }

    /* 3. Contenedor de los bloques de productos */
    .categories-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .category-card {
      background-color: rgba(0, 0, 0, 0.85); /* Fondo semitransparente */
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      flex: 1;
      padding: 20px;
      text-align: center;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .category-card:hover {
      transform: translateY(-5px);
      background-color: rgba(0, 0, 0, 0.95);
      border-color: #ffffff;
    }

    /* Estilo de la imagen del producto */
    .product-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: #222; /* Color mientras no carga la foto */
    }

    .category-card h3 {
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* Estilo para el precio */
    .price {
      font-size: 22px;
      font-weight: bold;
      color: #00ff66; /* Verde llamativo para el precio */
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- Encabezado / Header -->
  <header>
    <div class="top-bar">
      <a href="#">Localizador de Tiendas</a>
      <a href="#">Contáctanos</a>
      <a href="#">Quiero Vender Motos</a>
    </div>

    <nav class="main-nav">
      <div class="logo">CATALOGO PEPE</div>
      <button class="btn-categories">☰ Categorías</button>

      <div class="search-box">
        <input type="text" placeholder="¿Qué estás buscando?">
        <button>🔍</button>
      </div>

      <div class="nav-user">
        <a href="#">Sigue tu pedido</a>
        <a href="#">Mi cuenta</a>
        <span>🛒</span>
      </div>
    </nav>
  </header>

  <!-- Título principal -->
  <div class="content">
    <h1>CATALOGO PEPE</h1>
  </div>

  <!-- Bloques de productos con imagen y precio -->
  <section class="categories-container">
    <div class="category-card">
      <img src="./llanta.jpg" alt="Llantas" class="product-img">
      <h3>Llantas</h3>
      <p class="price">S/ 30.00</p>
    </div>

    <div class="category-card">
      <img src="./aceite.jpg" alt="Aceite" class="product-img">
      <h3>Aceite</h3>
      <p class="price">S/ 40.00</p>
    </div>

    <div class="category-card">
      <img src="./carburador.jpg" alt="Carburador" class="product-img">
      <h3>Carburador</h3>
      <p class="price">S/ 50.00</p>
    </div>
  </section>

</body>
</html>
